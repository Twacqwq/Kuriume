name: Build and Release

# A version tag builds every platform into a draft release. Merging a
# release/vX.Y.Z pull request tags and calls this (release-tag.yml); a tag on
# main pushed by hand starts it too. Review the draft's notes on the release
# page and publish it there; installed apps see it only then.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.2.0 or v0.2.0-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.93.0'
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-version.mjs "$RELEASE_TAG"
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  packages:
    needs: [prepare, checks]
    uses: ./.github/workflows/build-packages.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      artifact-prefix: release
    secrets: inherit

  publish:
    needs: [prepare, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          # Release notes compare with the previous version tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version-file: .node-version
      - name: Draft release notes from the commits since the previous tag
        run: node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, node24
        with:
          pattern: release-*
          path: artifacts/downloaded
          merge-multiple: true
      - name: Verify complete package set and provenance
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          KURIUME_BUILD_NUMBER: ${{ needs.packages.outputs.build-number }}
        run: node scripts/package-artifacts.mjs release
      # The checksums and build manifest stay with the workflow run for
      # tracing a build; the release itself carries only the installers
      # (GitHub shows each asset's SHA-256 there).
      - name: Keep the checksums and build manifest with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: build-records-${{ env.RELEASE_TAG }}
          path: |
            artifacts/release/SHA256SUMS
            artifacts/release/build-manifest.json
          if-no-files-found: error
          overwrite: true
      - name: Upload the complete package set to the draft release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA" || {
            echo 'The release tag moved after the build. Refusing to publish.' >&2
            exit 1
          }
          if gh release view "$RELEASE_TAG" --json isDraft,assets > release.json; then
            jq -e '.isDraft == true' release.json > /dev/null || {
              echo 'Refusing to overwrite an already published release.' >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file release-notes.md --title "Kuriume $RELEASE_TAG"
          fi
          # A full rerun has a new build number. Remove only superseded generated
          # assets from this unpublished draft, not unrelated attachments.
          if [ -s release.json ]; then
            jq -r '.assets[].name' release.json > draft-assets.txt
            while IFS= read -r asset; do
              case "$asset" in
                Kuriume-*.dmg|Kuriume-*.app.tar.gz|Kuriume-*.exe|Kuriume-*.msi|Kuriume-*.apk|Kuriume-*.ipa|Kuriume_*.dmg|Kuriume_*.exe)
                  if [ ! -f "artifacts/release/$asset" ]; then
                    gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                  fi
                  ;;
                # Earlier drafts also carried the build records.
                SHA256SUMS|build-manifest.json)
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                  ;;
              esac
            done < draft-assets.txt
          fi
          gh release upload "$RELEASE_TAG" artifacts/release/Kuriume-* --clobber
          # Stays a draft: the notes are reviewed and the release published by
          # hand. Previews never become the latest release.
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --prerelease
          else
            gh release edit "$RELEASE_TAG" --prerelease=false
          fi
          {
            echo "### Draft release $RELEASE_TAG is ready"
            echo
            echo "Review the notes, then publish it: ${GITHUB_SERVER_URL:-https://github.com}/$GH_REPO/releases"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
