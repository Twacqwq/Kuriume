name: Build packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit on main to build (defaults to this workflow's commit)
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      artifact-prefix:
        type: string
        default: packages
    outputs:
      build-number:
        description: Shared build number for the entire package set
        value: ${{ jobs.prepare.outputs.build-number }}
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build-number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Only sign code already in main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.93.0'
      - run: node scripts/check-version.mjs
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: version
        run: node scripts/mobile-version.mjs >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            bundles: app,dmg
            platform: macos-arm64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Ad-hoc is not Developer ID signing or notarization.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.93.0'
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, node24
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}
      - run: npm ci
      - name: Enable optional Developer ID signing and notarization
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const keys = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID'];
          for (const key of keys) assert(process.env[key]?.trim(), `MACOS_SIGNING_ENABLED requires ${key}. See CONTRIBUTING.md.`);
          assert(process.env.APPLE_SIGNING_IDENTITY.startsWith('Developer ID Application:'), 'Use a Developer ID Application certificate, not ad-hoc or App Store signing.');
          // Tauri imports the P12 into its temporary keychain. Never dump it.
          for (const key of keys) {
            const delimiter = randomUUID();
            appendFileSync(process.env.GITHUB_ENV, `${key}<<${delimiter}\n${process.env[key]}\n${delimiter}\n`);
          }
          JS
      - name: Build desktop bundles (without publishing)
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0, node24
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify Apple Silicon bundle and optional notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Kuriume.app
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          test "$(lipo -archs "$app/Contents/MacOS/$executable")" = arm64
          codesign --verify --deep --strict "$app"
          if [ "$MACOS_SIGNING_ENABLED" = true ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose "$app"
          fi
      - uses: ./.github/actions/package-artifact
        with:
          platform: ${{ matrix.platform }}
          source-sha: ${{ needs.prepare.outputs.sha }}
          build-number: ${{ needs.prepare.outputs.build-number }}
          signing: ${{ runner.os == 'macOS' && (vars.MACOS_SIGNING_ENABLED == 'true' && 'notarized' || 'ad-hoc') || 'unsigned' }}
          paths: ${{ steps.tauri.outputs.artifactPaths }}
          prefix: ${{ inputs.artifact-prefix || 'packages' }}

  ios:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KURIUME_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.93.0'
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ios-device
      - run: npm ci
      - run: npm run ios:build:ipa
      - uses: ./.github/actions/package-artifact
        with:
          platform: ios-unsigned
          source-sha: ${{ needs.prepare.outputs.sha }}
          build-number: ${{ needs.prepare.outputs.build-number }}
          signing: unsigned
          prefix: ${{ inputs.artifact-prefix || 'packages' }}

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KURIUME_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version-file: .node-version
          cache: npm
      - name: Restore private Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, appendFileSync } from 'node:fs';
          for (const key of ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']) {
            if (!process.env[key]) throw new Error(`Configure the repository secret ${key} before building APKs. See CONTRIBUTING.md.`);
          }
          const path = `${process.env.RUNNER_TEMP}/kuriume-release.jks`;
          writeFileSync(path, Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `ANDROID_KEYSTORE_PATH=${path}\n`);
          JS
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.93.0'
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64
      - name: Select JDK and install pinned Android tools
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          JAVA_HOME="$JAVA_HOME_17_X64" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'platform-tools'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:build:apk
      - uses: ./.github/actions/package-artifact
        with:
          platform: android-arm64
          source-sha: ${{ needs.prepare.outputs.sha }}
          build-number: ${{ needs.prepare.outputs.build-number }}
          signing: signed
          prefix: ${{ inputs.artifact-prefix || 'packages' }}
      - name: Remove temporary signing key
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f -- "$ANDROID_KEYSTORE_PATH"
          fi
