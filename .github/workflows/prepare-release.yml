name: Prepare Release

# Starts a release from the GitHub website: bumps every version file on a new
# branch release/vX.Y.Z, commits "chore(release): vX.Y.Z", tags it, opens the
# pull request into main and builds the draft release. The same as
# `npm run release -- X.Y.Z` followed by pushing the branch and the tag.
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.3.0 or 0.3.0-beta.1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  tag:
    # Releases are cut from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.93.0'
      - id: release
        name: Bump the version on a release branch, commit, tag and open the PR
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs "$VERSION"
          tag="v${VERSION#v}"
          branch="release/$tag"
          git push origin "$branch" "$tag"
          gh pr create --base main --head "$branch" --title "chore(release): $tag" --body "$(cat <<BODY
          Sets every version file to ${tag#v}. The tag $tag is already pushed and builds the draft release.

          Merge with **Create a merge commit** (not squash or rebase) so the tagged commit stays in main's history.

          Pull requests opened by GitHub Actions start no checks: close and reopen this one if main requires them.
          BODY
          )"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN start no workflows, so build directly.
  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
