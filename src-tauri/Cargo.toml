[workspace]
members = ["crates/kuriume-provider", "crates/kuriume-store", "crates/tauri-plugin-mobile"]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "2", features = [] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# Internal crates
kuriume-provider = { path = "crates/kuriume-provider" }
kuriume-store = { path = "crates/kuriume-store" }

[package]
name = "kuriume"
version.workspace = true
description = "An anime aggregation, parsing, and playback app"
authors = ["Twacqwq"]
license = "GPL-3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kuriume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
regex = "1"
ring = "0.17"
kuriume-provider = { workspace = true }
kuriume-store = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-mobile = { path = "crates/tauri-plugin-mobile" }
