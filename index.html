<!doctype html>
<html lang="en" style="background-color: #141112">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.png" />
    <link rel="preload" href="/fonts/manrope-vf.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141112" />
    <title>Kuriume</title>
    <!-- Launch splash: inline so it paints before the app bundle loads.
         src/lib/splash.ts removes it once the first catalog data is ready.
         The mascot drawing matches src/components/kuri-loader.tsx. -->
    <style>
      @font-face { font-family: "Manrope"; font-weight: 200 800; font-display: swap; src: url("/fonts/manrope-vf.woff2") format("woff2"); }
      #splash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse 85% 55% at 50% 46%, rgba(164, 83, 74, 0.24), transparent 70%), #141112; transition: opacity 0.45s ease; animation: sp-failsafe 0.4s 8s forwards; }
      #splash.sp-out { opacity: 0; pointer-events: none; }
      #splash.sp-out .sp-center { transform: translateY(-8px) scale(1.04); }
      .sp-sky, .sp-fall { position: absolute; inset: 0; pointer-events: none; }
      .sp-sky b { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #eeeae8; opacity: 0; animation: sp-star 2.6s var(--d) ease-in-out infinite; }
      .sp-fall i { position: absolute; top: -5%; left: var(--x); width: calc(18px * var(--s)); height: calc(11px * var(--s)); opacity: 0; animation: sp-fall var(--t) var(--d) linear infinite; }
      .sp-fall svg { display: block; width: 100%; height: 100%; fill: #c8a36c; }
      .sp-fall i:nth-child(3n) svg { fill: #a4534a; }
      .sp-fall i:nth-child(3n + 1) svg { fill: #e0a59c; }
      .sp-center { position: relative; display: flex; flex-direction: column; align-items: center; transition: transform 0.45s ease; margin-top: -4vh; }
      .sp-kuri { width: 136px; height: 142px; transform-origin: 50% 100%; animation: sp-drop 0.95s 0.12s cubic-bezier(0.3, 0, 0.4, 1) both; }
      .sp-kuri svg { width: 100%; height: 100%; overflow: visible; }
      .spk-shadow { transform-box: fill-box; transform-origin: center; animation: sp-shadow 0.95s 0.12s ease-out both; }
      .spk-leaf { transform-box: fill-box; transform-origin: 0% 50%; animation: sp-sway 1.6s 0.9s ease-in-out infinite; }
      .spk-eyes { transform-box: fill-box; transform-origin: center; animation: sp-blink 2.4s 1.25s infinite; }
      .sp-word { margin-top: 22px; display: flex; font: 800 40px/1 Manrope, system-ui, sans-serif; letter-spacing: 0.01em; color: #eeeae8; }
      .sp-word span { display: inline-block; animation: sp-letter 0.5s calc(0.72s + var(--i) * 0.055s) cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .sp-word span:first-child { color: #e0a59c; }
      .sp-sub { margin-top: 12px; display: flex; align-items: center; gap: 10px; color: #a59d9a; font: 500 13px/1 "Noto Sans SC", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif; letter-spacing: 0.18em; animation: sp-fade 0.6s 1.15s ease-out both; }
      .sp-sub b { color: #c8a36c; font-weight: 700; letter-spacing: 0.3em; }
      .sp-sub i { width: 4px; height: 4px; border-radius: 50%; background: #6e5550; }
      @keyframes sp-drop {
        0% { transform: translateY(-58vh) scale(0.92, 1.1); }
        55% { transform: translateY(0) scale(1.16, 0.84); }
        70% { transform: translateY(-20px) scale(0.95, 1.06); }
        84% { transform: translateY(0) scale(1.06, 0.94); }
        100% { transform: none; }
      }
      @keyframes sp-shadow { 0% { opacity: 0; transform: scaleX(0.2); } 55% { opacity: 1; transform: scaleX(1.15); } 70% { transform: scaleX(0.8); } 100% { opacity: 1; transform: none; } }
      @keyframes sp-sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(12deg); } }
      @keyframes sp-blink { 0%, 88%, 100% { transform: none; } 93% { transform: scaleY(0.1); } }
      @keyframes sp-letter { from { opacity: 0; transform: translateY(18px) scale(0.7); } to { opacity: 1; transform: none; } }
      @keyframes sp-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes sp-star { 0%, 100% { opacity: 0; } 50% { opacity: 0.55; } }
      @keyframes sp-fall { 0% { opacity: 0; transform: translate(0, 0) rotate(0deg); } 10% { opacity: 0.85; } 85% { opacity: 0.7; } 100% { opacity: 0; transform: translate(-26vw, 112vh) rotate(520deg); } }
      @keyframes sp-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .sp-kuri, .spk-shadow, .spk-leaf, .spk-eyes, .sp-word span, .sp-sub { animation: none; }
        .sp-sky, .sp-fall { display: none; }
      }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-sky"><b style="left:12%;top:10%;--d:0.2s"></b><b style="left:28%;top:18%;--d:1.1s"></b><b style="left:44%;top:7%;--d:0.6s"></b><b style="left:67%;top:14%;--d:1.6s"></b><b style="left:84%;top:9%;--d:0.9s"></b><b style="left:91%;top:24%;--d:0.3s"></b><b style="left:8%;top:30%;--d:1.9s"></b><b style="left:73%;top:31%;--d:1.3s"></b><b style="left:55%;top:22%;--d:2.2s"></b></div>
      <div class="sp-fall"><i style="--x:14%;--d:0.3s;--t:5.2s;--s:1"><svg viewBox="0 0 20 12"><path d="M1 6 C6 -1 16 0 19 6 C14 12 5 12 1 6Z"/></svg></i><i style="--x:36%;--d:1.4s;--t:6s;--s:0.7"><svg viewBox="0 0 20 12"><path d="M1 6 C6 -1 16 0 19 6 C14 12 5 12 1 6Z"/></svg></i><i style="--x:60%;--d:0.7s;--t:5.6s;--s:0.9"><svg viewBox="0 0 20 12"><path d="M1 6 C6 -1 16 0 19 6 C14 12 5 12 1 6Z"/></svg></i><i style="--x:80%;--d:2.0s;--t:4.8s;--s:1.1"><svg viewBox="0 0 20 12"><path d="M1 6 C6 -1 16 0 19 6 C14 12 5 12 1 6Z"/></svg></i><i style="--x:92%;--d:1.1s;--t:6.4s;--s:0.8"><svg viewBox="0 0 20 12"><path d="M1 6 C6 -1 16 0 19 6 C14 12 5 12 1 6Z"/></svg></i><i style="--x:48%;--d:2.6s;--t:5.4s;--s:0.65"><svg viewBox="0 0 20 12"><path d="M1 6 C6 -1 16 0 19 6 C14 12 5 12 1 6Z"/></svg></i><i style="--x:26%;--d:3.2s;--t:5.8s;--s:0.9"><svg viewBox="0 0 20 12"><path d="M1 6 C6 -1 16 0 19 6 C14 12 5 12 1 6Z"/></svg></i></div>
      <div class="sp-center">
        <div class="sp-kuri">
          <svg viewBox="0 -4 100 104">
          <g class="spk-shadow"><ellipse cx="50" cy="96" rx="25" ry="3.2" fill="#000" opacity=".32"/></g>
          <g class="spk-body">
          <path d="M50 10 C61 18 84 32 86.5 57.5 C88.5 78 71.5 92 50 92 C28.5 92 11.5 78 13.5 57.5 C16 32 39 18 50 10Z" fill="#9c5639" stroke="#4b261c" stroke-width="2" stroke-linejoin="round"/>
          <path d="M14.4 65 C30 72 70 72 85.6 65 C82.5 82.5 68.5 92 50 92 C31.5 92 17.5 82.5 14.4 65Z" fill="#efd9b4" stroke="#4b261c" stroke-width="2" stroke-linejoin="round"/>
          <g fill="#cfae84"><circle cx="27" cy="74" r=".9"/><circle cx="35" cy="80" r=".9"/><circle cx="44" cy="76" r=".9"/><circle cx="53" cy="82" r=".9"/><circle cx="62" cy="77" r=".9"/><circle cx="71" cy="80" r=".9"/><circle cx="40" cy="86" r=".9"/><circle cx="58" cy="87" r=".9"/><circle cx="76" cy="73.5" r=".9"/><circle cx="49" cy="86.5" r=".9"/></g>
          <path d="M27 36 C31 28 38 22 44 18.5" stroke="#fff" stroke-opacity=".42" stroke-width="3.2" stroke-linecap="round" fill="none"/>
          <path d="M50 10 C50.5 6 53 3.5 56 3" stroke="#4b261c" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path class="spk-leaf" d="M56 3 C62 -3 72 -1 74 4 C68 9 60 8 56 3Z" fill="#c8a36c" stroke="#4b261c" stroke-width="1.6" stroke-linejoin="round"/>
          <path class="spk-leaf-vein" d="M58 3.4 C63 2.6 68 2.8 72 4" stroke="#4b261c" stroke-width="1" stroke-linecap="round" fill="none"/>
          <g class="spk-eyes">
          <ellipse cx="37.5" cy="52" rx="3.6" ry="4.8" fill="#2c1511"/><ellipse cx="62.5" cy="52" rx="3.6" ry="4.8" fill="#2c1511"/>
          <circle cx="38.8" cy="50" r="1.5" fill="#fff"/><circle cx="63.8" cy="50" r="1.5" fill="#fff"/>
          <circle cx="36.4" cy="54.6" r=".7" fill="#fff" opacity=".8"/><circle cx="61.4" cy="54.6" r=".7" fill="#fff" opacity=".8"/>
          </g>
          <ellipse cx="28.5" cy="59.5" rx="5.2" ry="2.7" fill="#f4a195" opacity=".7"/><ellipse cx="71.5" cy="59.5" rx="5.2" ry="2.7" fill="#f4a195" opacity=".7"/>
          <path d="M46.8 58.2 Q50 63 53.2 58.2 Z" fill="#7a2c26" stroke="#2c1511" stroke-width="1.3" stroke-linejoin="round"/>
          </g>
          </svg>
        </div>
        <div class="sp-word"><span style="--i:0">K</span><span style="--i:1">u</span><span style="--i:2">r</span><span style="--i:3">i</span><span style="--i:4">u</span><span style="--i:5">m</span><span style="--i:6">e</span></div>
        <div class="sp-sub"><b>栗梅</b><i></i><span>今天也一起追番吧</span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
