<!doctype html>
<html lang="en" style="background-color: #141112">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon.png" />
    <link rel="preload" href="/fonts/manrope-vf.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141112" />
    <title>Kuriume</title>
    <!-- Launch splash: inline so it paints before the app bundle loads.
         src/lib/splash.ts removes it once the first catalog data is ready. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse 90% 60% at 50% 42%, rgba(164, 83, 74, 0.22), transparent 70%), #141112; transition: opacity 0.45s ease; animation: sp-failsafe 0.4s 8s forwards; }
      #splash.sp-out { opacity: 0; pointer-events: none; }
      #splash.sp-out .sp-center { transform: scale(1.06); }
      .sp-center { display: flex; flex-direction: column; align-items: center; gap: 18px; transition: transform 0.45s ease; }
      .sp-flower { width: 104px; height: 104px; overflow: visible; animation: sp-turn 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .sp-p { fill: #a4534a; transform-box: fill-box; transform-origin: center; animation: sp-pop 0.6s calc(0.12s + var(--i) * 0.08s) cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .sp-heart { fill: #6e342e; transform-box: fill-box; transform-origin: center; animation: sp-pop 0.4s 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .sp-stamens { stroke: #c8a36c; stroke-width: 1.2; stroke-linecap: round; fill: #c8a36c; transform-box: fill-box; transform-origin: center; animation: sp-pop 0.45s 0.62s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .sp-ring { fill: none; stroke: #e0a59c; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; opacity: 0; animation: sp-ring 0.9s 0.55s ease-out both; }
      .sp-word { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #eeeae8; font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif; animation: sp-rise 0.6s 0.75s ease-out both; }
      .sp-word b { font-size: 26px; font-weight: 700; letter-spacing: 0.3em; margin-right: -0.3em; }
      .sp-word span { font: 600 11px/1 Manrope, system-ui, sans-serif; color: #a59d9a; letter-spacing: 0.42em; margin-right: -0.42em; animation: sp-track 1s 0.75s ease-out both; }
      .sp-fall { position: absolute; inset: 0; }
      .sp-fall i { position: absolute; top: -6%; left: var(--x); width: calc(14px * var(--s)); height: calc(10px * var(--s)); border-radius: 100% 0; background: #e0a59c; opacity: 0; animation: sp-fall var(--t) var(--d) linear infinite; }
      .sp-fall i:nth-child(odd) { background: #a4534a; }
      @keyframes sp-pop { from { opacity: 0; transform: scale(0) rotate(-30deg); } to { opacity: 1; transform: none; } }
      @keyframes sp-turn { from { transform: rotate(-90deg); } to { transform: none; } }
      @keyframes sp-ring { 0% { opacity: 0.8; transform: scale(0.6); } 100% { opacity: 0; transform: scale(1.9); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes sp-track { from { letter-spacing: 0.9em; opacity: 0; } to { letter-spacing: 0.42em; opacity: 1; } }
      @keyframes sp-fall { 0% { opacity: 0; transform: translate(0, 0) rotate(0deg); } 10% { opacity: 0.85; } 85% { opacity: 0.7; } 100% { opacity: 0; transform: translate(-28vw, 112vh) rotate(560deg); } }
      @keyframes sp-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .sp-flower, .sp-p, .sp-heart, .sp-stamens, .sp-word, .sp-word span { animation: none; }
        .sp-ring, .sp-fall { display: none; }
      }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-fall"><i style="--x:12%;--d:0.2s;--t:4.2s;--s:1"></i><i style="--x:34%;--d:1.1s;--t:5s;--s:0.7"></i><i style="--x:58%;--d:0.5s;--t:4.6s;--s:0.9"></i><i style="--x:76%;--d:1.6s;--t:3.8s;--s:1.1"></i><i style="--x:90%;--d:0.9s;--t:5.4s;--s:0.8"></i><i style="--x:47%;--d:2.2s;--t:4.4s;--s:0.6"></i><i style="--x:24%;--d:2.8s;--t:4.8s;--s:0.9"></i></div>
      <div class="sp-center">
        <svg class="sp-flower" viewBox="-50 -50 100 100">
          <circle class="sp-ring" r="40" />
          <g transform="rotate(0)"><circle class="sp-p" style="--i:0" cx="0" cy="-23" r="17"/></g><g transform="rotate(72)"><circle class="sp-p" style="--i:1" cx="0" cy="-23" r="17"/></g><g transform="rotate(144)"><circle class="sp-p" style="--i:2" cx="0" cy="-23" r="17"/></g><g transform="rotate(216)"><circle class="sp-p" style="--i:3" cx="0" cy="-23" r="17"/></g><g transform="rotate(288)"><circle class="sp-p" style="--i:4" cx="0" cy="-23" r="17"/></g>
          <circle class="sp-heart" r="9" />
          <g class="sp-stamens"><g transform="rotate(18)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g><g transform="rotate(54)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g><g transform="rotate(90)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g><g transform="rotate(126)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g><g transform="rotate(162)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g><g transform="rotate(198)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g><g transform="rotate(234)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g><g transform="rotate(270)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g><g transform="rotate(306)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g><g transform="rotate(342)"><line x1="0" y1="-6" x2="0" y2="-14"/><circle cx="0" cy="-15" r="1.8"/></g></g>
        </svg>
        <div class="sp-word"><b>栗梅</b><span>KURIUME</span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
